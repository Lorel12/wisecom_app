services:
  - type: web
    name: wisecom-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server
    buildCommand: npm ci && npx prisma generate --schema prisma-postgresql/schema.prisma && npm run build
    preDeployCommand: npx prisma migrate deploy --schema prisma-postgresql/schema.prisma
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: wisecom-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wisecom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: CONTACT_EMAIL
        value: lorelngoumi@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: wisecom-db
    databaseName: wisecom
    user: wisecom
    region: frankfurt
    plan: basic-256mb
